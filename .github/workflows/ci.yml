name: CI / Déploiement

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Déploiement Cloudflare
    needs: check
    # Uniquement après fusion sur main (jamais pour une PR).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID manquants (voir README, section CI)."; exit 1
          fi
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::error::wrangler.jsonc contient encore le database_id factice : renseignez celui de 'wrangler d1 create'."; exit 1
          fi
      - run: npm ci
      - run: npm run build
      # Les migrations sont appliquées AVANT le nouveau code (elles ne sont jamais rejouées deux fois).
      - name: Migrations D1
        run: npx wrangler d1 migrations apply ricci-garage --remote
      - name: Déploiement
        run: npx wrangler deploy
